<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- CRT screen background -->
  <rect x="1" y="1" width="46" height="46" rx="4" fill="#060a06" stroke="#1a8a38" stroke-width="1.5"/>

  <!-- terminal corner brackets -->
  <g stroke="#33ff66" stroke-width="2" fill="none" filter="url(#glow)">
    <path d="M6 12V7h5"/>
    <path d="M42 12V7h-5"/>
    <path d="M6 36v5h5"/>
    <path d="M42 36v5h-5"/>
  </g>

  <!-- tower base (turret) -->
  <g filter="url(#glow)">
    <rect x="18" y="30" width="12" height="8" fill="#33ff66"/>
    <path d="M15 30h18l-3-9H18z" fill="#1a8a38"/>
    <rect x="22" y="10" width="4" height="12" fill="#33ff66"/>
  </g>

  <!-- crosshair -->
  <g stroke="#33e0ff" stroke-width="1.4" filter="url(#glow)">
    <circle cx="24" cy="12" r="5" fill="none"/>
    <path d="M24 5v4M24 15v4M17 12h4M27 12h4"/>
  </g>
</svg>
