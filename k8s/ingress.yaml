apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: towerdef-io
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - towerdef.io
      secretName: towerdef-io-tls
  rules:
    - host: towerdef.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: towerdef-io
                port:
                  number: 80
