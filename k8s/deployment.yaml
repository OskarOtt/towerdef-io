apiVersion: apps/v1
kind: Deployment
metadata:
  name: towerdef-io
  labels:
    app: towerdef-io
spec:
  replicas: 2
  selector:
    matchLabels:
      app: towerdef-io
  template:
    metadata:
      labels:
        app: towerdef-io
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: towerdef-io
          # Image published by .github/workflows/deploy.yml on push to main
          image: ghcr.io/oskarott/towerdef-io:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
